spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/inventory}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

inventory:
  events:
    enabled: ${INVENTORY_EVENTS_ENABLED:true}
  outbox:
    enabled: ${INVENTORY_OUTBOX_ENABLED:true}
    poll-interval-ms: 1000
    max-attempts-per-pass: 20
    lease-ms: 60000
    ack-wait-ms: 12000
    max-block-ms: 2000
    delivery-timeout-ms: 10000
    request-timeout-ms: 3000

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    phase: "4B - asynchronous completion"
