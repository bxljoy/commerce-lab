name: CI

# CI: run both service test suites on every push to main and on PRs — unit + slice
# (Surefire) plus Testcontainers integration tests (Failsafe) on a clean Linux runner.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run if a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: commerce service tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Temurin 21 matches the JRE the Dockerfile ships on; cache: maven keeps
      # ~/.m2 between runs so we don't re-download dependencies every time.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # GitHub-hosted runners have Docker, so each service's Testcontainers suite
      # can spin up its own Postgres. tee lets the next step inspect order-service
      # JVM output; bash -eo pipefail ensures a Maven failure still fails the step.
      - name: Verify order-service
        run: make verify-order 2>&1 | tee test-output.log

      # Guard the portability fix: if Mockito ever self-attaches the Byte Buddy
      # agent at runtime again (e.g. the Surefire -javaagent pre-load in
      # order-service/pom.xml gets dropped), the JVM prints the JEP 451 warning.
      # That pattern passes here but breaks in hardened/sandboxed runtimes, so we
      # fail the build on it rather than let it regress silently.
      - name: Verify the Byte Buddy agent was pre-loaded
        run: |
          if grep -Eq "A Java agent has been loaded dynamically|Mockito is currently self-attaching" test-output.log; then
            echo "::error::Mockito self-attached the Byte Buddy agent at runtime. The Surefire -javaagent pre-load in order-service/pom.xml is not taking effect — tests would break in hardened/sandboxed runtimes."
            exit 1
          fi
          echo "OK — no dynamic agent loading detected; the agent is pre-loaded at JVM startup."

      - name: Verify inventory-service
        run: make verify-inventory

      - name: Build image and verify restart persistence
        run: make verify-restart

      - name: Build image and verify inventory behavior
        run: make verify-inventory-image

      - name: Verify two-service response loss and restart recovery
        run: make verify-sync-recovery

      - name: Verify isolated Compose failure cleanup
        run: |
          for script in verify-order-restart verify-inventory-service verify-sync-recovery; do
            status=0
            VERIFY_FAIL_AFTER_START=1 bash "scripts/${script}.sh" || status=$?
            test "$status" -eq 97
          done
