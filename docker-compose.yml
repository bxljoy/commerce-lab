# Commerce Lab — local stack.
# Phase 0: order-service. Phases 2 and 3A add each service's own Postgres database.
# Later phases add Kafka/Redpanda (Phase 4) and observability (Phase 5).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume → orders survive `docker compose down` + restart.
      - order-pgdata:/var/lib/postgresql/data
    networks:
      - order-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  order-service:
    build: ./order-service
    image: commerce-lab/order-service:0.0.1
    ports:
      - "${ORDER_SERVICE_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: order
      SPRING_DATASOURCE_PASSWORD: order
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - order-network
      - service-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Allow for Flyway migration + JPA validation on a cold start.
      start_period: 40s
    restart: unless-stopped

  inventory-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "${INVENTORY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    image: commerce-lab/inventory-service:0.0.1
    ports:
      - "${INVENTORY_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
    depends_on:
      inventory-postgres:
        condition: service_healthy
    networks:
      - inventory-network
      - service-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - service-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  topic-init:
    image: apache/kafka:3.7.1
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic commerce.orders.v1
        --partitions 3 --replication-factor 1
        --config retention.ms=604800000 --config cleanup.policy=delete
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - service-network
    restart: "no"

volumes:
  kafka-data:
  order-pgdata:
  inventory-pgdata:

networks:
  order-network:
  inventory-network:
  service-network:
